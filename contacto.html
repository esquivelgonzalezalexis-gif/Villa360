<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Villa 360</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">

  <form class="formulario" id="formContacto">

    <h2>📩 Contáctanos</h2>

    <label>Nombre completo</label>
    <input type="text" id="nom" required>

    <label>Teléfono</label>
    <input type="tel" id="tel" maxlength="10" required>

    <label>Correo electrónico</label>
    <input type="email" id="correo" required>

    <label>Mensaje</label>
    <textarea id="mensaje" rows="4" required></textarea>

    <div class="botones">
      <button type="button" onclick="guardarContacto()">
        Enviar y guardar
      </button>
      <button type="reset">Limpiar</button>
      <a class="boton" href="inicio.html">Regresar</a>
    </div>

  </form>

  <h2 style="text-align:center;">Contactos registrados</h2>
  <div id="listaContactos" class="grid"></div>

</div>

<script>
const form = document.getElementById("formContacto");

function mostrarContactos(){
 const lista=document.getElementById("listaContactos");
 const contactos=JSON.parse(localStorage.getItem("contactos"))||[];
 lista.innerHTML="";
 contactos.forEach(c=>{
   lista.innerHTML+=`
   <div class="card">
     <h3>${c.nombre}</h3>
     <p>📞 ${c.telefono}</p>
     <p>✉️ ${c.correo}</p>
     <p>${c.mensaje}</p>
   </div>`;
 });
}

form.addEventListener("submit",e=>{
 e.preventDefault();

 if(!nom.value||!tel.value||!correo.value||!mensaje.value){
   alert("Debes completar todos los campos");
   return;
 }

 let contactos=JSON.parse(localStorage.getItem("contactos"))||[];

 contactos.push({
   nombre:nom.value,
   telefono:tel.value,
   correo:correo.value,
   mensaje:mensaje.value
 });

 localStorage.setItem("contactos",JSON.stringify(contactos));

 alert("Contacto guardado correctamente");
 form.reset();
 mostrarContactos();
});

mostrarContactos();
</script>

</body>
</html>

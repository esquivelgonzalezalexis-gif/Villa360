<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Artesanos | Villa 360</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">

  <form class="formulario" id="form">

    <h2>Registro de Artesanos</h2>

    <label>Nombre completo</label>
    <input type="text" id="nombre" required>

    <label>Teléfono</label>
    <input type="tel" id="telefono" pattern="[0-9]{10}" maxlength="10" required>

    <label>Comunidad</label>
    <input type="text" id="comunidad" required>

    <label>Producto</label>
    <select id="producto" required>
      <option value="">Selecciona</option>
      <option>Rebozos</option>
      <option>Textiles</option>
      <option>Gastronomía</option>
      <option>Cerámica</option>
      <option>Accesorios</option>
      <option>Cestería</option>
    </select>

    <label>Correo electrónico</label>
    <input type="email" id="correo" required>

    <label>Comentario</label>
    <textarea id="comentario" rows="3" required></textarea>

    <div class="botones">
      <button type="submit">Enviar y guardar</button>
      <button type="reset">Limpiar</button>
      <a class="boton" href="inicio.html">Regresar</a>
    </div>

  </form>

  <h2>Artesanos registrados</h2>
  <div id="lista" class="grid"></div>
 <div class="Limpiar">
    <button type="">Limpiar</button>
  </div>

  

</div>

<script src="script.js"></script>

</body>
</html>
